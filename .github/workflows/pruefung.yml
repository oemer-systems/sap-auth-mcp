# Läuft bei jedem Push und jedem Pull Request automatisch auf einem Rechner von GitHub.
name: Prüfung

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Pakete installieren
        # pywin32 wird über seinen Umgebungsmarker unter Linux von selbst ausgelassen
        run: pip install -r requirements.txt

      - name: Alle Tests ausführen
        run: python -m pytest

  sod-linter:
    name: SoD-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Paket für das Regelwerk installieren
        run: pip install pyyaml

      - name: Beispiel-Service prüfen und Ergebnis anzeigen
        # Der Beispiel-Service enthält absichtlich Fehler. Deshalb soll dieser Schritt
        # nicht fehlschlagen, sondern das Ergebnis in der Zusammenfassung zeigen.
        run: |
          python linter/sod_linter.py beispiel-cap/csn.json beispiel-cap/xs-security.json > ergebnis.txt || true
          cat ergebnis.txt
          {
            echo "## SoD-Linter: Beispiel-Service"
            echo "Die Fehler sind absichtlich eingebaut, um den Linter zu zeigen."
            echo '```'
            cat ergebnis.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker-Image
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Image bauen
        run: docker build -t sap-auth-mcp:ci .

      - name: Alle Tests im Container ausführen
        run: docker run --rm sap-auth-mcp:ci python -m pytest -q -p no:cacheprovider

      - name: Sicherheit prüfen
        # Der Container darf nicht als Administrator laufen und muss in Berlin-Zeit rechnen
        run: |
          benutzer=$(docker run --rm sap-auth-mcp:ci whoami)
          echo "Benutzer im Container: $benutzer"
          test "$benutzer" = "assistent"
          zone=$(docker run --rm sap-auth-mcp:ci date +%Z)
          echo "Zeitzone im Container: $zone"
          test "$zone" = "CET" -o "$zone" = "CEST"

      - name: Größe in der Zusammenfassung anzeigen
        run: |
          {
            echo "## Docker-Image"
            echo "| Name | Größe |"
            echo "| --- | --- |"
            docker image ls sap-auth-mcp:ci --format "| {{.Repository}}:{{.Tag}} | {{.Size}} |"
          } >> "$GITHUB_STEP_SUMMARY"
